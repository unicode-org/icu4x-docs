name: Run icu4x-convert

on:
  workflow_dispatch:
    inputs:
      icu4x_version:
        description: 'ICU4X Minor Version (e.g. 2.3)'
        required: true
        type: string
      icu4x_ref:
        description: 'ICU4X Git Ref (default: release/<version>)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    name: Convert ICU4X Docs & Generate Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout icu4x-docs
        uses: actions/checkout@v4

      - name: Compute ICU4X Ref
        id: compute-ref
        run: |
          REF="${{ inputs.icu4x_ref }}"
          if [ -z "$REF" ]; then
            REF="release/${{ inputs.icu4x_version }}"
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT

      - name: Clone ICU4X and doxygen-awesome-css (Shallow & Out of Tree)
        run: |
          git clone --depth 1 --branch "${{ steps.compute-ref.outputs.ref }}" https://github.com/unicode-org/icu4x.git "${{ runner.temp }}/icu4x"
          git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git "${{ runner.temp }}/icu4x/doxygen-awesome-css"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust & WASM Target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown

      - name: Install System Packages (Doxygen)
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Global TypeDoc
        run: npm install -g typedoc

      - name: Install icu4x-docs Dependencies
        run: npm ci

      - name: Run icu4x-convert
        run: |
          npm run icu4x-convert -- \
            --icu4xDir="${{ runner.temp }}/icu4x" \
            --icu4xVersion=${{ inputs.icu4x_version }} \
            --icu4xRef=${{ steps.compute-ref.outputs.ref }} \
            --overwrite \
            --outputScriptPath="${{ runner.temp }}/build-artifacts.sh"

      - name: Build Artifacts (cppdoc, tsdoc, wasmdemo)
        run: bash "${{ runner.temp }}/build-artifacts.sh"

      - name: Validate Astro Build
        run: npm run build

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          git add .
          git commit -m "🤖 Update docs to ICU4X ${{ inputs.icu4x_version }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BRANCH="update-icu4x-${{ inputs.icu4x_version }}-${COMMIT_HASH}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Update to ICU4X ${{ inputs.icu4x_version }}" \
            --body "Automated update generated by \`icu4x-convert\` workflow for ICU4X ${{ inputs.icu4x_version }} (ref \`${{ steps.compute-ref.outputs.ref }}\`)." \
            --head "$BRANCH" \
            --base main
